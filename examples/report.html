<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Artie example report</title>
  <style>
    body { margin: 0; color: #172033; background: #fff; font: 1rem/1.6 system-ui, sans-serif; }
    main { max-width: 42rem; margin: 3rem auto; padding: 0 1rem; }
    h1 { line-height: 1.2; }
    summary { cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Example report</h1>
    <p>This is a synthetic artifact for checking an Artie setup.</p>
    <details>
      <summary>Publication check</summary>
      <p>The audience label above tells readers how this copy was published.</p>
    </details>
  </main>
</body>
</html>
